[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade, S: security checks
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of tests.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
